global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: clipsense-api
    scrape_timeout: 5s
    static_configs:
      - targets: [api:9091]
  - job_name: clipsense-worker
    scrape_timeout: 5s
    static_configs:
      - targets: [worker:9092]
