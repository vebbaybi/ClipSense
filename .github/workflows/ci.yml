name: CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "docker-compose.yml"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "apps/api/**"
      - "apps/web/**"
      - "scripts/ci/**"
      - "infra/observability/**"
      - "infra/scripts/monitoring/**"
      - ".env.example"
      - "docs/adr/0015-github-actions-docker-verification.md"
      - "docs/audits/SPRINT_1_WORK_UNIT_1_REPORT.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "docker-compose.yml"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "apps/api/**"
      - "apps/web/**"
      - "scripts/ci/**"
      - "infra/observability/**"
      - "infra/scripts/monitoring/**"
      - ".env.example"
      - "docs/adr/0015-github-actions-docker-verification.md"
      - "docs/audits/SPRINT_1_WORK_UNIT_1_REPORT.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Test API
        run: |
          go test -count=1 ./...
          go vet ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  worker:
    name: Python Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api/ai_worker
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Compile worker source
        run: python -m py_compile main.py zip_safety.py

      - name: Run worker tests
        # Only lightweight test dependencies; no model download in unit tests.
        run: |
          python -m pip install prometheus-client==0.22.1
          python -m unittest discover -s tests

  web:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Web telemetry tests and type checking
        run: |
          npm test
          npm run typecheck

      - name: Record remaining web dependency risk
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); if (!a.metadata) process.exit(1); console.log(a.metadata.vulnerabilities)'
          python ../../scripts/ci/security-policy.py npm npm-audit.json

      - name: Upload web audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-audit-${{ github.sha }}
          path: apps/web/npm-audit.json
          if-no-files-found: error
          retention-days: 14

  compose:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate compose file
        run: docker compose config

  docker-runtime:
    name: Build and verify Compose runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: clipsense-ci
      EVIDENCE_DIR: artifacts/docker-runtime
      SOURCE_SHA: ${{ github.sha }}
      APP_ENV: test
      MAX_UPLOAD_REQUEST_BYTES: "1048576"
      COMPOSE_PROFILES: observability
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Configure ephemeral test signing key
        shell: bash
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
          grafana_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$grafana_secret"
          echo "GRAFANA_ADMIN_PASSWORD=$grafana_secret" >> "$GITHUB_ENV"

      - name: Record runner and source attribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "# Docker runtime verification"
            echo
            echo "- Runner OS: $RUNNER_OS"
            echo "- Runner architecture: $RUNNER_ARCH"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Git reference: \`$GITHUB_REF\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Attempt: \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Trigger: \`$GITHUB_EVENT_NAME\`"
            echo "- Started (UTC): \`$(date -u +%FT%TZ)\`"
            echo
            echo "## Toolchain"
            echo
            echo '```text'
            docker version
            docker compose version
            docker buildx version
            echo '```'
          } | tee "$EVIDENCE_DIR/run-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate resolved Compose configuration
        shell: bash
        run: bash scripts/ci/verify-docker-runtime.sh config

      - name: Build application images
        shell: bash
        run: bash scripts/ci/verify-docker-runtime.sh build

      - name: Verify full runtime
        shell: bash
        run: bash scripts/ci/verify-docker-runtime.sh runtime

      - name: Verify authentication and upload boundaries
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          python scripts/ci/verify-observability.py | tee "$EVIDENCE_DIR/observability.txt"
          python scripts/ci/verify-security-boundaries.py | tee "$EVIDENCE_DIR/security-boundaries.txt"
          docker compose exec -T worker python - < scripts/ci/verify-media-boundary.py | tee "$EVIDENCE_DIR/media-boundary.txt"

      - name: Container and Python security inventory plus SBOM
        run: bash scripts/ci/scan-images.sh

      - name: Retain security and supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-security-sbom-${{ github.sha }}
          path: artifacts/security
          if-no-files-found: error
          retention-days: 14

      - name: Collect final diagnostics
        if: always()
        shell: bash
        run: bash scripts/ci/verify-docker-runtime.sh diagnostics

      - name: Publish final summary
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "## Completion"
            echo
            echo "- Result: \`${{ job.status }}\`"
            echo "- Completed (UTC): \`$(date -u +%FT%TZ)\`"
            echo "- Evidence artifact: \`docker-runtime-${GITHUB_SHA}\`"
          } | tee -a "$EVIDENCE_DIR/run-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-runtime-${{ github.sha }}
          path: artifacts/docker-runtime
          if-no-files-found: error
          retention-days: 14
