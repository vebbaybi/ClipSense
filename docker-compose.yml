version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: clipsense
      POSTGRES_PASSWORD: clipsense
      POSTGRES_DB: clipsense
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipsense -d clipsense"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.8.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *"200 OK"* ]]'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-production}
      - BUILD_SHA=${SOURCE_SHA:-unknown}
      - METRICS_ADDR=:9091
      - JWT_SECRET=${JWT_SECRET:-}
      - AUTH_MAX_ATTEMPTS=${AUTH_MAX_ATTEMPTS:-10}
      - AUTH_WINDOW_SECONDS=${AUTH_WINDOW_SECONDS:-60}
      - MAX_UPLOAD_REQUEST_BYTES=${MAX_UPLOAD_REQUEST_BYTES:-210763776}
      - API_ADDR=:8080
      - DB_DRIVER=postgres
      - DATABASE_URL=postgres://clipsense:clipsense@postgres:5432/clipsense?sslmode=disable
      - UPLOAD_DIR=/data/uploads
      - REDIS_URL=redis://redis:6379
    volumes:
      - clipsense-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    build:
      context: ./apps/api/ai_worker
      dockerfile: Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-production}
      - BUILD_SHA=${SOURCE_SHA:-unknown}
      - METRICS_HOST=0.0.0.0
      - DB_DRIVER=postgres
      - DATABASE_URL=postgres://clipsense:clipsense@postgres:5432/clipsense?sslmode=disable
      - UPLOAD_DIR=/data/uploads
      - PROCESS_DIR=/data/processing
      - WHISPER_MODEL=small
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - clipsense-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  web:
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        BUILD_SHA: ${SOURCE_SHA:-unknown}
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=1GB"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api, worker]

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    entrypoint: ["/bin/sh", "-ec", "test $${#GF_SECURITY_ADMIN_PASSWORD} -ge 16 || { echo 'Grafana requires an explicit 16-character password'; exit 1; }; exec /run.sh"]
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

volumes:
  prometheus-data:
  grafana-data:
  clipsense-data:
  pgdata:
  qdrant-data:
