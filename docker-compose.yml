version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: clipsense
      POSTGRES_PASSWORD: clipsense
      POSTGRES_DB: clipsense
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.8.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - API_ADDR=:8080
      - DB_DRIVER=postgres
      - DATABASE_URL=postgres://clipsense:clipsense@postgres:5432/clipsense?sslmode=disable
      - UPLOAD_DIR=/data/uploads
      - REDIS_URL=redis://redis:6379
      - VECTOR_HOST=qdrant
      - VECTOR_PORT=6333
    volumes:
      - clipsense-data:/data
    depends_on:
      - postgres
      - redis
      - qdrant
    ports:
      - "8080:8080"

  worker:
    build:
      context: ./apps/api/ai_worker
      dockerfile: Dockerfile
    environment:
      - DB_DRIVER=postgres
      - DATABASE_URL=postgres://clipsense:clipsense@postgres:5432/clipsense?sslmode=disable
      - UPLOAD_DIR=/data/uploads
      - PROCESS_DIR=/data/processing
      - WHISPER_MODEL=small
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - clipsense-data:/data
    depends_on:
      - postgres
      - redis
      - qdrant

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
      - worker

volumes:
  clipsense-data:
  pgdata:
  qdrant-data:
