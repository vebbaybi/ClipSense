version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: clipsense
      POSTGRES_PASSWORD: clipsense
      POSTGRES_DB: clipsense
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipsense -d clipsense"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.8.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *"200 OK"* ]]'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - API_ADDR=:8080
      - DB_DRIVER=postgres
      - DATABASE_URL=postgres://clipsense:clipsense@postgres:5432/clipsense?sslmode=disable
      - UPLOAD_DIR=/data/uploads
      - REDIS_URL=redis://redis:6379
    volumes:
      - clipsense-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: ./apps/api/ai_worker
      dockerfile: Dockerfile
    environment:
      - DB_DRIVER=postgres
      - DATABASE_URL=postgres://clipsense:clipsense@postgres:5432/clipsense?sslmode=disable
      - UPLOAD_DIR=/data/uploads
      - PROCESS_DIR=/data/processing
      - WHISPER_MODEL=small
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - clipsense-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  clipsense-data:
  pgdata:
  qdrant-data:
